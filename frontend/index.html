<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clínica Veterinária</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Clínica Veterinária 🐾</h1>

    <button type="button" id="btnBuscar">Buscar animais</button>
    <p id="mensagem" role="status"></p>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Espécie</th>
          <th>Raça</th>
          <th>Idade</th>
          <th>Tutor</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="listaAnimais"></tbody>
    </table>

    <section>
      <h2>Cadastrar animal</h2>

      <form id="formAnimal">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required />

        <label for="especie">Espécie:</label>
        <input type="text" id="especie" name="especie" required />

        <label for="raca">Raça:</label>
        <input type="text" id="raca" name="raca" required />

        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade" min="0" required />

        <label for="nome_tutor">Tutor:</label>
        <input type="text" id="nome_tutor" name="nome_tutor" required />

        <button type="submit" id="btnSalvar">Cadastrar</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
